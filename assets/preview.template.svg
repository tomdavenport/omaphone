<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1600"
     height="900"
     viewBox="0 0 1600 900"
     role="img"
     aria-labelledby="title description">
  <title id="title">Omaphone on an Omarchy 4 desktop</title>
  <desc id="description">A real Omarchy 4 desktop screenshot with Omaphone open and a short list of product features.</desc>

  <defs>
    <!-- Keep the screenshot honest and readable: no blur, fake UI, or generated
         desktop elements are added. The left mask only gives the launch copy a
         stable contrast zone over different wallpapers. -->
    <linearGradient id="reading-mask" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#080A0D" stop-opacity="0.98"/>
      <stop offset="0.28" stop-color="#080A0D" stop-opacity="0.94"/>
      <stop offset="0.46" stop-color="#080A0D" stop-opacity="0.40"/>
      <stop offset="0.60" stop-color="#080A0D" stop-opacity="0.08"/>
      <stop offset="0.70" stop-color="#080A0D" stop-opacity="0"/>
      <stop offset="1" stop-color="#080A0D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor-mask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.64" stop-color="#080A0D" stop-opacity="0"/>
      <stop offset="1" stop-color="#080A0D" stop-opacity="0.38"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="9" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#0A0C10"/>
  <!-- This sibling file is replaced only by a real screenshot captured from the
       authorised disposable Omarchy 4 VM. -->
  <image x="0" y="0" width="1600" height="900"
         xlink:href="omaphone-screenshot.png"
         preserveAspectRatio="xMidYMid slice"/>
  <rect width="1600" height="900" fill="url(#reading-mask)"/>
  <rect width="1600" height="900" fill="url(#floor-mask)"/>

  <g transform="translate(88 78)" filter="url(#soft-shadow)">
    <circle cx="9" cy="9" r="8" fill="#B8F46B"/>
    <circle cx="9" cy="9" r="3" fill="#17200E"/>
    <text x="30" y="16"
          fill="#E7EAEF"
          font-family="JetBrainsMono Nerd Font, JetBrains Mono, Noto Sans Mono, monospace"
          font-size="21"
          font-weight="700"
          letter-spacing="2.8">OMARCHY 4  /  TERMINALPHONE</text>
  </g>

  <g transform="translate(84 202)" filter="url(#soft-shadow)">
    <text x="0" y="0"
          fill="#FFFFFF"
          font-family="JetBrainsMono Nerd Font, JetBrains Mono, Noto Sans Mono, monospace"
          font-size="104"
          font-weight="700"
          letter-spacing="-5">OMAPHONE</text>
    <text x="4" y="66"
          fill="#F1F3F5"
          font-family="Noto Sans, Liberation Sans, sans-serif"
          font-size="34"
          font-weight="600">A private walkie-talkie in your bar.</text>
    <text x="4" y="111"
          fill="#B9BFC8"
          font-family="Noto Sans, Liberation Sans, sans-serif"
          font-size="24"
          font-weight="500">Hold to record. Release to send. Tor carries it.</text>
  </g>

  <g transform="translate(90 482)"
     fill="#F4F6F8"
     font-family="JetBrainsMono Nerd Font, JetBrains Mono, Noto Sans Mono, monospace"
     font-size="24"
     font-weight="700"
     letter-spacing="0.7"
     filter="url(#soft-shadow)">
    <circle cx="8" cy="-8" r="5" fill="#B8F46B"/>
    <text x="30" y="0">PRIVATE CALLS OVER TOR</text>

    <circle cx="8" cy="48" r="5" fill="#B8F46B"/>
    <text x="30" y="56">HOLD, TALK, RELEASE</text>

    <circle cx="8" cy="104" r="5" fill="#B8F46B"/>
    <text x="30" y="112">ENCRYPTED TEXT CHAT</text>

    <circle cx="8" cy="160" r="5" fill="#B8F46B"/>
    <text x="30" y="168">HOST A SMALL GROUP</text>
    <rect x="351" y="139" width="166" height="38" rx="19"
          fill="#B8F46B" fill-opacity="0.14"
          stroke="#B8F46B" stroke-opacity="0.76" stroke-width="1.5"/>
    <text x="371" y="165"
          fill="#D9FFAA"
          font-size="15"
          font-weight="700"
          letter-spacing="1.1">EXPERIMENTAL</text>
  </g>

  <g transform="translate(88 826)" filter="url(#soft-shadow)">
    <rect x="0" y="-19" width="4" height="24" rx="2" fill="#B8F46B"/>
    <text x="17" y="0"
          fill="#CFD4DB"
          font-family="Noto Sans, Liberation Sans, sans-serif"
          font-size="18"
          font-weight="600">Native bar widget · one simple panel · no terminal to babysit</text>
  </g>

  <rect x="1" y="1" width="1598" height="898" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
</svg>
