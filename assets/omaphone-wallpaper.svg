<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1920"
     height="1080"
     viewBox="0 0 1920 1080"
     role="img"
     aria-labelledby="title description">
  <title id="title">Omaphone signal paths wallpaper</title>
  <desc id="description">An abstract near-black wallpaper with restrained lime, cyan, and violet signal paths. Original artwork with no external assets.</desc>
  <metadata>
    Original vector artwork created for the Omaphone project in 2026.
    It contains no third-party imagery, logos, text, or interface elements.
  </metadata>

  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070A"/>
      <stop offset="0.52" stop-color="#090C12"/>
      <stop offset="1" stop-color="#06070B"/>
    </linearGradient>

    <radialGradient id="lime-haze" cx="0.25" cy="0.63" r="0.52">
      <stop offset="0" stop-color="#B8F46B" stop-opacity="0.16"/>
      <stop offset="0.36" stop-color="#8DDC6A" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#8DDC6A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan-haze" cx="0.47" cy="0.33" r="0.50">
      <stop offset="0" stop-color="#5CE4DF" stop-opacity="0.14"/>
      <stop offset="0.44" stop-color="#4BC2D7" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#4BC2D7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-haze" cx="0.61" cy="0.67" r="0.44">
      <stop offset="0" stop-color="#9C72F2" stop-opacity="0.13"/>
      <stop offset="0.46" stop-color="#7B5BC2" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#7B5BC2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signal" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#B8F46B"/>
      <stop offset="0.42" stop-color="#61E6D3"/>
      <stop offset="0.76" stop-color="#7C94FF"/>
      <stop offset="1" stop-color="#A36AF4"/>
    </linearGradient>
    <linearGradient id="signal-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8F46B" stop-opacity="0"/>
      <stop offset="0.14" stop-color="#B8F46B" stop-opacity="0.62"/>
      <stop offset="0.50" stop-color="#61E6D3" stop-opacity="0.42"/>
      <stop offset="0.82" stop-color="#A36AF4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#A36AF4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="right-calm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06080C" stop-opacity="0"/>
      <stop offset="0.58" stop-color="#06080C" stop-opacity="0.12"/>
      <stop offset="0.78" stop-color="#06080C" stop-opacity="0.74"/>
      <stop offset="1" stop-color="#06080C" stop-opacity="0.96"/>
    </linearGradient>

    <filter id="wide-glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="tight-glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="31" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.65
                0 0 0 0 0.72
                0 0 0 0 0.82
                0 0 0 0.038 0"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <mask id="left-center-mask">
      <linearGradient id="mask-gradient" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.82"/>
        <stop offset="0.64" stop-color="#FFFFFF" stop-opacity="1"/>
        <stop offset="0.84" stop-color="#FFFFFF" stop-opacity="0.25"/>
        <stop offset="1" stop-color="#000000"/>
      </linearGradient>
      <rect width="1920" height="1080" fill="url(#mask-gradient)"/>
    </mask>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#lime-haze)"/>
  <rect width="1920" height="1080" fill="url(#cyan-haze)"/>
  <rect width="1920" height="1080" fill="url(#violet-haze)"/>

  <!-- A broad low-contrast fold gives the desktop depth without competing
       with windows, widgets, or readable type. -->
  <path d="M-180 1010 C 214 943, 306 659, 584 552 C 824 459, 916 228, 1178 -112"
        fill="none" stroke="url(#signal)" stroke-opacity="0.105"
        stroke-width="168" stroke-linecap="round" filter="url(#wide-glow)"
        mask="url(#left-center-mask)"/>
  <path d="M-160 1030 C 240 960, 332 677, 600 570 C 838 475, 930 247, 1197 -99"
        fill="none" stroke="#61E6D3" stroke-opacity="0.055"
        stroke-width="76" stroke-linecap="round" filter="url(#wide-glow)"
        mask="url(#left-center-mask)"/>

  <!-- Parallel signal paths: precise enough to feel deliberate, quiet enough
       to disappear behind a terminal or the Omaphone panel. -->
  <g fill="none" mask="url(#left-center-mask)" filter="url(#soften)">
    <path d="M-130 1008 C 235 955, 337 695, 599 584 C 837 483, 925 270, 1176 -92"
          stroke="url(#signal-fade)" stroke-width="2.4" stroke-opacity="0.70"/>
    <path d="M-88 1050 C 280 984, 370 730, 630 614 C 874 505, 969 294, 1215 -68"
          stroke="url(#signal-fade)" stroke-width="1.3" stroke-opacity="0.50"/>
    <path d="M-196 954 C 171 915, 282 652, 550 534 C 775 435, 875 210, 1133 -138"
          stroke="url(#signal-fade)" stroke-width="1.2" stroke-opacity="0.40"/>
    <path d="M38 1082 C 378 988, 448 766, 698 644 C 923 534, 1020 336, 1266 8"
          stroke="url(#signal-fade)" stroke-width="0.9" stroke-opacity="0.28"/>
    <path d="M-252 890 C 96 886, 213 600, 501 486 C 714 402, 815 171, 1064 -166"
          stroke="url(#signal-fade)" stroke-width="0.8" stroke-opacity="0.24"/>
  </g>

  <!-- Three restrained waypoints provide a memorable focal rhythm without
       suggesting controls or application chrome. -->
  <g filter="url(#tight-glow)">
    <circle cx="304" cy="760" r="4.5" fill="#B8F46B" fill-opacity="0.92"/>
    <circle cx="652" cy="542" r="3.5" fill="#61E6D3" fill-opacity="0.82"/>
    <circle cx="930" cy="258" r="2.8" fill="#9C72F2" fill-opacity="0.68"/>
  </g>

  <!-- Hairline orbital echoes, kept mostly left of centre. -->
  <g fill="none" stroke-linecap="round" mask="url(#left-center-mask)">
    <path d="M112 720 C 290 490, 615 396, 918 460 C 1086 496, 1193 578, 1304 702"
          stroke="#61E6D3" stroke-width="0.8" stroke-opacity="0.09"/>
    <path d="M42 656 C 266 382, 630 306, 957 399 C 1115 444, 1240 539, 1356 686"
          stroke="#9C72F2" stroke-width="0.7" stroke-opacity="0.07"/>
    <path d="M188 794 C 347 587, 641 506, 901 545 C 1069 570, 1176 641, 1260 736"
          stroke="#B8F46B" stroke-width="0.7" stroke-opacity="0.075"/>
  </g>

  <rect width="1920" height="1080" fill="url(#right-calm)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.68"/>

  <!-- Soft vignette anchors the Omarchy bar and avoids bright monitor edges. -->
  <rect x="1" y="1" width="1918" height="1078" rx="1"
        fill="none" stroke="#000000" stroke-opacity="0.45" stroke-width="34"/>
</svg>
